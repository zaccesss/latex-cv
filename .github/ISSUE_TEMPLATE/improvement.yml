name: Improvement idea
description: Suggest a change to the layout, the docs or how parsers read the PDF
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you change and why?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example
      description: A sketch, a link or a few lines of LaTeX, if you have one.
    validations:
      required: false
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
