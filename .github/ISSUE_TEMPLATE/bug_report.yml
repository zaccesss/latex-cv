name: Compile or layout problem
description: The files do not compile or the layout breaks
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Never paste a real CV with personal details.
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: How you compiled it
      options:
        - Overleaf with XeLaTeX
        - Overleaf with LuaLaTeX
        - Tectonic
        - latexmk with XeLaTeX
        - Something else
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or screenshot
      description: Paste the first error from the log.
    validations:
      required: false
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zaccesss/ai-policy). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
